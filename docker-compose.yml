version: '3.8'

services:
  nexus-api:
    build: .
    ports:
      - "8000:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEXUS_MODEL=gemini-2.5-flash
      - OTEL_SERVICE_NAME=nexusops-enterprise-gateway
    volumes:
      - ./data:/app/data

  nexus-ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - nexus-api
    volumes:
      - ./data:/app/data
