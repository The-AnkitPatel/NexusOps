services:
  nexus-api:
    build: .
    image: nexusops:latest
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NEXUS_MODEL=${NEXUS_MODEL:-gemini-2.5-flash}
      - OTEL_SERVICE_NAME=nexusops-enterprise-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nexus-ui:
    image: nexusops:latest
    build: .
    restart: unless-stopped
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - nexus-api
