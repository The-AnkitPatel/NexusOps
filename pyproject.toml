[project]
name = "nexusops"
version = "0.1.0"
description = "Production Forward-Deployed Enterprise Agentic Gateway with OpenTelemetry Telemetry and Vertex AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "google-genai>=0.1.1",
    "httpx>=0.27.0",
    "streamlit>=1.39.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
